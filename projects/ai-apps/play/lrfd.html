<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>볼트쌤의 LRFD 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EC;--ink:#2B2D42;--steel:#3D5A80;--sky:#CFE4F2;--accent:#EE6C4D;--ok:#2A9D8F;--no:#E63946;--ten:#2F6FDB;--com:#E04F3A;--muted:#7a7f95;--line:#eadfcd}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 48px;min-height:100vh}
header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hbtn{border:none;background:#fff;border-radius:12px;padding:8px 11px;font-size:15px;box-shadow:0 2px 0 var(--line);cursor:pointer;color:var(--ink);font-family:inherit}
.htitle{flex:1;font-family:'Jua',sans-serif;font-size:18px;line-height:1.25}
.htitle small{display:block;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--muted)}
.stars{font-family:'Jua',sans-serif;font-size:16px;background:#fff;padding:6px 10px;border-radius:12px;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.prog{height:8px;background:#eadfcd;border-radius:6px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s}
.vis{background:#fff;border-radius:18px;padding:10px;box-shadow:0 3px 0 var(--line);margin-bottom:12px}
.vis svg{width:100%;height:auto;display:block}
.talk{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.mascot{font-size:26px;flex:none;width:46px;height:46px;border-radius:50%;background:var(--sky);display:grid;place-items:center}
.bubble{background:#fff;border-radius:4px 18px 18px 18px;padding:12px 14px;box-shadow:0 3px 0 var(--line);flex:1;font-size:16.5px;line-height:1.65}
.bubble p{margin:0 0 9px}.bubble p:last-child{margin:0}
.new{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.k{color:var(--accent);font-weight:800}
.t{color:var(--ten);font-weight:800}.c{color:var(--com);font-weight:800}
.eq{display:inline-block;background:#f3efe8;border-radius:8px;padding:1px 7px;font-weight:600}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:14px;font-family:'Jua',sans-serif;font-size:19px;background:var(--steel);color:#fff;box-shadow:0 4px 0 #24364f;cursor:pointer;margin-top:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #24364f}
.btn.alt{background:#fff;color:var(--steel);box-shadow:0 4px 0 var(--line)}
.btn.go{background:var(--accent);box-shadow:0 4px 0 #b5492f}
.qtag{font-family:'Jua',sans-serif;color:var(--accent);font-size:15px;margin-bottom:4px}
.q{font-size:17.5px;font-weight:600;line-height:1.55;margin-bottom:12px}
.opts{display:grid;gap:9px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid #e3d6c2;background:#fff;border-radius:14px;padding:13px 14px;font-size:16px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.45}
.opts.two .opt{text-align:center;font-family:'Jua',sans-serif;font-size:22px}
.opt.right{border-color:var(--ok);background:#e6f6f3}
.opt.wrong{border-color:var(--no);background:#fdecee;animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15.5px;line-height:1.65}
.fb.ok{background:#e6f6f3;border-left:5px solid var(--ok)}
.fb.no{background:#fff1e6;border-left:5px solid var(--accent)}
.fb b{font-family:'Jua',sans-serif;font-weight:400;font-size:17px}
.calc{font-family:'Jua',sans-serif;font-size:19px;line-height:1.8;background:#fff;border-radius:14px;padding:10px 14px;margin:8px 0;box-shadow:0 3px 0 var(--line)}
.calc div{animation:pop .35s ease-out both}
.home h1{font-family:'Jua',sans-serif;font-size:34px;line-height:1.2;margin:18px 0 6px;font-weight:400}
.home .sub{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:14px}
.scenes{display:grid;gap:8px;margin-top:10px}
.scn{display:flex;gap:10px;align-items:center;background:#fff;border:none;border-radius:14px;padding:11px 12px;box-shadow:0 2px 0 var(--line);text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);font-size:15px}
.scn .n{font-family:'Jua',sans-serif;background:var(--sky);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;flex:none;font-size:17px}
.scn .done{margin-left:auto;color:var(--ok);font-family:'Jua',sans-serif}
.overlay{position:fixed;inset:0;background:rgba(43,45,66,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 14px 28px;max-height:85vh;overflow:auto}
.sheet h3{font-family:'Jua',sans-serif;font-weight:400;margin:0 0 6px;font-size:20px}
.slider{background:#fff;border-radius:18px;padding:14px;box-shadow:0 3px 0 var(--line);margin-bottom:10px}
.slider input{width:100%;accent-color:var(--accent);height:30px}
.tval{font-family:'Jua',sans-serif;font-size:30px;text-align:center}
.tval small{font-size:16px;color:var(--muted)}
.barrow{margin:10px 0}
.barrow .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar{position:relative;height:22px;background:#f1ebe1;border-radius:8px;overflow:visible}
.bar i{display:block;height:100%;border-radius:8px;transition:width .2s,background .2s}
.bar .nu{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--ink);border-radius:2px}
.nulab{font-size:12.5px;color:var(--muted);margin-top:4px;text-align:right}
.sum{background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 0 var(--line);margin:10px 0;line-height:1.7;font-size:15.5px}
.sum h4{margin:0 0 4px;font-family:'Jua',sans-serif;font-weight:400;font-size:17px;color:var(--steel)}
.big{font-family:'Jua',sans-serif;font-size:44px;text-align:center;margin:6px 0}
.credit{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.6}
.legend{display:flex;gap:12px;justify-content:center;font-size:13px;margin-top:4px}
.legend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle;background:var(--clr)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ============ 그림(SVG) ============ */
const F = "font-family='Jua, sans-serif'";
function svgWrap(vb, inner){return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`}
function arrowDefs(){return `<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2D42"/></marker>
<marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EE6C4D"/></marker>
<marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/></marker>
</defs>`}

function kid(x,y,c){return `<g transform="translate(${x},${y})"><circle cx="0" cy="-26" r="8" fill="#FFD6A5"/><rect x="-8" y="-18" width="16" height="18" rx="5" fill="${c}"/></g>`}

function visBench(){
  return svgWrap("0 0 320 170", arrowDefs()+`
  <line x1="10" y1="150" x2="310" y2="150" stroke="#cdbfa8" stroke-width="3"/>
  <rect x="50" y="98" width="220" height="14" rx="5" fill="#3D5A80"/>
  <rect x="68" y="112" width="10" height="38" fill="#3D5A80"/><rect x="242" y="112" width="10" height="38" fill="#3D5A80"/>
  ${kid(95,98,'#EE6C4D')}${kid(130,98,'#2A9D8F')}${kid(165,98,'#F4A261')}${kid(200,98,'#2F6FDB')}${kid(235,98,'#9B5DE5')}
  <line x1="160" y1="22" x2="160" y2="58" stroke="#2B2D42" stroke-width="3" marker-end="url(#ah)"/>
  <text x="170" y="40" ${F} font-size="15" fill="#2B2D42">누르는 무게</text>
  <line x1="73" y1="168" x2="73" y2="154" stroke="#2A9D8F" stroke-width="3" marker-end="url(#ahG)"/>
  <line x1="247" y1="168" x2="247" y2="154" stroke="#2A9D8F" stroke-width="3" marker-end="url(#ahG)"/>
  <text x="8" y="140" ${F} font-size="13" fill="#2A9D8F">버티는 힘</text>`);
}

function visModes(){
  return svgWrap("0 0 330 150", `
  <g transform="translate(10,10)"><rect width="96" height="128" rx="14" fill="#fdecee"/>
   <path d="M14 70 L44 64 L40 74 L48 68" stroke="#3D5A80" stroke-width="8" fill="none" stroke-linecap="round"/>
   <path d="M54 66 L84 80" stroke="#3D5A80" stroke-width="8" stroke-linecap="round"/>
   <text x="48" y="40" text-anchor="middle" font-size="26">🐘</text>
   <text x="48" y="104" text-anchor="middle" ${F} font-size="15" fill="#E63946">와장창!</text>
   <text x="48" y="122" text-anchor="middle" font-size="11" fill="#2B2D42">극한 Ultimate</text></g>
  <g transform="translate(117,10)"><rect width="96" height="128" rx="14" fill="#fff4dc"/>
   <rect x="12" y="62" width="72" height="10" rx="4" fill="#3D5A80"/>
   <path d="M44 62 L48 67 L44 72" stroke="#fff" stroke-width="2.5" fill="none"/>
   <text x="48" y="44" text-anchor="middle" ${F} font-size="14" fill="#2B2D42">톡톡 ×10000</text>
   <text x="48" y="104" text-anchor="middle" ${F} font-size="15" fill="#d98a00">쩍 금 감</text>
   <text x="48" y="122" text-anchor="middle" font-size="11" fill="#2B2D42">피로 Fatigue</text></g>
  <g transform="translate(224,10)"><rect width="96" height="128" rx="14" fill="#e6f1fa"/>
   <path d="M12 66 Q30 50 48 66 T84 66" stroke="#3D5A80" stroke-width="8" fill="none" stroke-linecap="round"/>
   <text x="48" y="40" text-anchor="middle" font-size="22">😵‍💫</text>
   <text x="48" y="104" text-anchor="middle" ${F} font-size="15" fill="#2F6FDB">출렁출렁</text>
   <text x="48" y="122" text-anchor="middle" font-size="11" fill="#2B2D42">사용성 Serviceability</text></g>`);
}

function visSteelFail(){
  return svgWrap("0 0 330 150", `
  <g transform="translate(10,10)"><rect width="96" height="128" rx="14" fill="#f3efe8"/>
   <path d="M38 8 L58 8 L58 38 Q52 52 58 66 L58 92 L38 92 L38 66 Q44 52 38 38 Z" fill="#3D5A80"/>
   <text x="48" y="112" text-anchor="middle" ${F} font-size="17">항복</text><text x="48" y="127" text-anchor="middle" font-size="11">쭉~ 늘어남</text></g>
  <g transform="translate(117,10)"><rect width="96" height="128" rx="14" fill="#f3efe8"/>
   <path d="M38 8 L58 8 L58 46 L50 52 L38 44 Z" fill="#3D5A80"/>
   <path d="M38 60 L46 54 L58 62 L58 92 L38 92 Z" fill="#3D5A80"/>
   <text x="48" y="112" text-anchor="middle" ${F} font-size="17">파단</text><text x="48" y="127" text-anchor="middle" font-size="11">뚝! 끊어짐</text></g>
  <g transform="translate(224,10)"><rect width="96" height="128" rx="14" fill="#f3efe8"/>
   <path d="M48 8 Q74 50 48 92" stroke="#3D5A80" stroke-width="7" fill="none" stroke-linecap="round"/>
   <path d="M30 6 L48 6 M30 2 L30 10" stroke="#2B2D42" stroke-width="0"/>
   <text x="48" y="112" text-anchor="middle" ${F} font-size="17">좌굴</text><text x="48" y="127" text-anchor="middle" font-size="11">휘청 꺾임</text></g>`);
}

function visLoadFactor(){
  // D 300 -> 360(1.2) / 420(1.4) ; L 75 -> 120
  const s=0.27;
  const bar=(x,v,c,lab,top)=>`<rect x="${x}" y="${150-v*s}" width="38" height="${v*s}" rx="6" fill="${c}"/>
    <text x="${x+19}" y="${144-v*s}" text-anchor="middle" ${F} font-size="14">${top}</text>
    <text x="${x+19}" y="168" text-anchor="middle" font-size="12">${lab}</text>`;
  return svgWrap("0 0 330 178", `
   ${bar(20,300,'#98C1D9','D 원래','300')}${bar(64,360,'#3D5A80','D ×1.2','360')}
   ${bar(170,75,'#F7C6B5','L 원래','75')}${bar(214,120,'#EE6C4D','L ×1.6','120')}
   <text x="84" y="18" text-anchor="middle" ${F} font-size="14" fill="#3D5A80">의자 몸무게: 조금 부풀림</text>
   <text x="230" y="18" text-anchor="middle" ${F} font-size="14" fill="#EE6C4D">친구들: 많이 부풀림</text>
   <line x1="10" y1="150" x2="320" y2="150" stroke="#cdbfa8" stroke-width="2"/>`);
}

function visChain(items, pick){
  // items: [{name, v}]
  let g=""; const w=100;
  items.forEach((it,i)=>{
    const x=15+i*w, weak = pick!==undefined && i===pick;
    g+=`<ellipse cx="${x+45}" cy="70" rx="44" ry="26" fill="none" stroke="${weak?'#E63946':'#3D5A80'}" stroke-width="${weak?7:9}" ${weak?"stroke-dasharray='14 6'":""}/>
    <text x="${x+45}" y="76" text-anchor="middle" ${F} font-size="18" fill="${weak?'#E63946':'#2B2D42'}">${it.v}</text>
    <text x="${x+45}" y="122" text-anchor="middle" ${F} font-size="14">${it.name}</text>`;
  });
  return svgWrap("0 0 330 140", `<text x="165" y="22" text-anchor="middle" ${F} font-size="14" fill="#7a7f95">각 고리 = 망가지는 방법별 설계강도 (kN)</text>`+g);
}

function visScale(req, des, show){
  const diff = show ? Math.max(-1,Math.min(1,(req-des)/120)) : 0; // + : 왼쪽(소요) 무거움
  const ang = diff*12;
  return svgWrap("0 0 330 190", `
   <polygon points="165,70 150,170 180,170" fill="#cdbfa8"/>
   <g transform="rotate(${-ang} 165 70)">
     <rect x="35" y="66" width="260" height="8" rx="4" fill="#3D5A80"/>
     <g transform="translate(75,74) rotate(${ang})"><line x1="0" y1="0" x2="0" y2="22" stroke="#7a7f95" stroke-width="2"/>
       <rect x="-55" y="22" width="110" height="46" rx="12" fill="#fff1e6" stroke="#EE6C4D" stroke-width="2"/>
       <text x="0" y="42" text-anchor="middle" font-size="11.5">걱정 무게(소요강도)</text>
       <text x="0" y="62" text-anchor="middle" ${F} font-size="18" fill="#EE6C4D">${req} kN</text></g>
     <g transform="translate(255,74) rotate(${ang})"><line x1="0" y1="0" x2="0" y2="22" stroke="#7a7f95" stroke-width="2"/>
       <rect x="-55" y="22" width="110" height="46" rx="12" fill="#e6f6f3" stroke="#2A9D8F" stroke-width="2"/>
       <text x="0" y="42" text-anchor="middle" font-size="11.5">버티는 힘(설계강도)</text>
       <text x="0" y="62" text-anchor="middle" ${F} font-size="18" fill="#2A9D8F">${des} kN</text></g>
   </g>
   <text x="165" y="22" text-anchor="middle" ${F} font-size="15">${show ? (des>=req?'버티는 힘이 이겼다! 안전 ✅':'걱정 무게가 더 커! 위험 ❌') : '어느 쪽이 이길까?'}</text>`);
}

/* 트러스: 하현 B0~B4, 상현 T0~T3 (정삼각형) */
const BX=i=>30+70*i, BY=175, TX=i=>65+70*i, TY=175-60.6;
const MEM=[
 ['B0','B1',1.15,'하현 단부'],['B1','B2',2.31,'하현 중앙'],['B2','B3',2.31,'하현 중앙'],['B3','B4',1.15,'하현 단부'],
 ['T0','T1',-1.73,'상현 단부'],['T1','T2',-2.31,'상현 중앙'],['T2','T3',-1.73,'상현 단부'],
 ['B0','T0',-2.31,'단부 사재'],['T0','B1',1.15,'2번째 사재'],['B1','T1',-1.15,'3번째 사재'],['T1','B2',0,'중앙 사재'],
 ['B2','T2',0,'중앙 사재'],['T2','B3',-1.15,'3번째 사재'],['B3','T3',1.15,'2번째 사재'],['T3','B4',-2.31,'단부 사재']];
function pt(n){const i=+n[1];return n[0]==='B'?[BX(i),BY]:[TX(i),TY]}
function visTruss(o={}){
  let s=arrowDefs();
  MEM.forEach(([a,b,f],idx)=>{
    const [x1,y1]=pt(a),[x2,y2]=pt(b);
    let col='#3D5A80', w=5, dash='';
    if(o.forces){ if(f>0){col='#2F6FDB'} else if(f<0){col='#E04F3A'} else {col='#b9b9c6';dash="stroke-dasharray='5 5'"} w=f===0?3:3+Math.abs(f)*1.6; }
    if(o.hi && o.hi.includes(idx)){col='#EE6C4D';w=7}
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${dash}/>`;
    if(o.forces){
      const mx=(x1+x2)/2,my=(y1+y2)/2, lbl=f===0?'0':(f>0?'+':'−')+Math.abs(f);
      const dy = y1===y2 ? (y1===BY?16:-8) : 4;
      s+=`<text x="${mx}" y="${my+dy}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${col==='#b9b9c6'?'#7a7f95':col}" paint-order="stroke" stroke="#fff" stroke-width="3">${lbl}</text>`;
    }
    if(o.labels && o.labels[idx]){
      const mx=(x1+x2)/2,my=(y1+y2)/2;
      s+=`<text x="${mx-14}" y="${my}" text-anchor="end" ${F} font-size="13" fill="#EE6C4D">${o.labels[idx]}</text>`;
    }
  });
  for(let i=0;i<5;i++) s+=`<circle cx="${BX(i)}" cy="${BY}" r="5" fill="#fff" stroke="#2B2D42" stroke-width="2"/>`;
  for(let i=0;i<4;i++){ s+=`<circle cx="${TX(i)}" cy="${TY}" r="5" fill="#fff" stroke="#2B2D42" stroke-width="2"/>
     <line x1="${TX(i)}" y1="${TY-48}" x2="${TX(i)}" y2="${TY-9}" stroke="#2B2D42" stroke-width="2.5" marker-end="url(#ah)"/>
     <text x="${TX(i)}" y="${TY-52}" text-anchor="middle" font-style="italic" font-weight="800" font-size="15">P</text>`;}
  s+=`<polygon points="${BX(0)},${BY+6} ${BX(0)-10},${BY+22} ${BX(0)+10},${BY+22}" fill="#2B2D42"/>
      <circle cx="${BX(4)}" cy="${BY+14}" r="8" fill="#2B2D42"/>`;
  if(o.react){ [0,4].forEach(i=>{s+=`<line x1="${BX(i)}" y1="${BY+60}" x2="${BX(i)}" y2="${BY+26}" stroke="#2A9D8F" stroke-width="3.5" marker-end="url(#ahG)"/>
      <text x="${BX(i)+(i?-8:8)}" y="${BY+55}" text-anchor="${i?'end':'start'}" ${F} font-size="16" fill="#2A9D8F">${o.react}</text>`});}
  if(o.jointA){ s+=`<circle cx="${BX(1)}" cy="${BY}" r="24" fill="none" stroke="#EE6C4D" stroke-width="2.5" stroke-dasharray="6 4"/>
      <text x="${BX(1)}" y="${BY+42}" text-anchor="middle" ${F} font-size="14" fill="#EE6C4D">Joint A</text>`;}
  if(o.ring0){ s+=`<circle cx="${BX(0)}" cy="${BY}" r="20" fill="none" stroke="#EE6C4D" stroke-width="2.5" stroke-dasharray="6 4"/>`;}
  const legend = o.forces ? `<text x="20" y="22" font-size="12" fill="#2F6FDB" font-weight="800">파랑 = 당겨짐(인장 +)</text><text x="180" y="22" font-size="12" fill="#E04F3A" font-weight="800">빨강 = 밀림(압축 −)</text>` : '';
  return svgWrap("0 0 340 245", s+legend);
}

function visJoint0(){
  // 왼쪽 끝 절점 힘 그림
  return svgWrap("0 0 330 200", arrowDefs()+`
   <line x1="120" y1="140" x2="190" y2="19" stroke="#E04F3A" stroke-width="9" stroke-linecap="round"/>

/* ============ 상태 ============ */
const TOTALQ = SCENES.reduce((n,s)=>n+s.steps.filter(x=>x.t==='q'||x.t==='slider').length,0);
let st = {view:'home', sc:0, sp:0, line:0, stars:0, got:{}, tries:0, solved:false, done:{}, menu:false, sliderT:6};
function save(){try{localStorage.setItem('lrfd-game',JSON.stringify({got:st.got,done:st.done}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('lrfd-game')||'null');if(d){st.got=d.got||{};st.done=d.done||{};st.stars=Object.keys(st.got).length}}catch(e){}}
load();

const app=document.getElementById('app');
function esc(s){return s}

function header(){
  const sc=SCENES[st.sc]; const n=sc.steps.length;
  const pct = Math.round(((st.sp)+(st.solved?1:0))/n*100);
  return `<header><button class="hbtn" onclick="openMenu()">☰</button>
    <div class="htitle">${st.sc+1}. ${sc.title}<small>${sc.sub}</small></div>
    <div class="stars">⭐ ${st.stars}</div></header>
    <div class="prog"><i style="width:${pct}%"></i></div>`;
}

function render(){
  if(st.view==='home') return renderHome();
  if(st.view==='end') return renderEnd();
  const step=SCENES[st.sc].steps[st.sp];
  let h=header();
  if(step.t==='talk') h+=renderTalk(step);
  else if(step.t==='q') h+=renderQ(step);
  else if(step.t==='slider') h+=renderSlider();
  app.innerHTML=h+(st.menu?menuHTML():'');
  if(step.t==='slider') bindSlider();
  window.scrollTo({top:0});
}

function renderHome(){
  let list=SCENES.map((s,i)=>`<button class="scn" onclick="goScene(${i})"><span class="n">${i+1}</span><span><b>${s.title}</b><br><small style="color:#7a7f95">${s.sub}</small></span>${st.done[i]?'<span class="done">✔</span>':''}</button>`).join('');
  app.innerHTML=`<div class="home">
   <div class="talk" style="margin-top:14px"><div class="mascot">🔩</div><div class="bubble">안녕! 나는 <span class="k">볼트쌤</span>이야. 강구조 설계의 핵심 <b>LRFD</b>를 놀이터 의자 만들기로 배워 보자!</div></div>
   <h1>볼트쌤의<br>LRFD 놀이터</h1>
   <div class="sub">하중은 걱정해서 크게, 버티는 힘은 겸손하게 작게.<br>개념 6단계 → 보스 문제 2개 → 최종 퀴즈</div>
   <button class="btn go" onclick="goScene(0)">시작하기 ▶</button>
   <div class="scenes">${list}</div>
   <div class="credit">강구조설계 LRFD 단원 (Practice Example 4) 기반<br>건축공학전공 곽지예 · AI(Claude) 활용 캡스톤 과제</div>
  </div>`+(st.menu?menuHTML():'');
}

function renderTalk(step){
  const lines=step.lines.slice(0,st.line+1).map((l,i)=>`<p class="${i===st.line?'new':''}">${l}</p>`).join('');
  const last = st.line>=step.lines.length-1;
  return `${step.vis?`<div class="vis">${step.vis()}</div>`:''}
   <div class="talk"><div class="mascot">🔩</div><div class="bubble">${lines}</div></div>
   <button class="btn ${last?'go':''}" onclick="nextLine()">${last?'알겠어! 다음 ▶':'계속 ▼'}</button>`;
}

let qState={picked:[],fb:null};
function renderQ(step){
  const vis = (st.solved && step.visOk) ? step.visOk : step.vis;
  const opts=step.opts.map((o,i)=>{
    let cls='opt'; if(qState.picked.includes(i)) cls+= i===step.a?' right':' wrong';
    return `<button class="${cls}" ${st.solved?'disabled':''} onclick="pick(${i})">${o}</button>`}).join('');
  let fb='';
  if(qState.fb==='ok') fb=`<div class="fb ok new"><b>${st.tries===1?'⭐ 한 번에 정답!':'좋아, 정답!'}</b><br>${step.ok}</div><button class="btn go" onclick="nextStep()">다음 ▶</button>`;
  else if(qState.fb==='no') fb=`<div class="fb no new"><b>괜찮아, 다시 해 보자 💪</b><br>${step.hint}</div>`;
  return `${vis?`<div class="vis">${vis()}</div>`:''}
   <div class="qtag">${step.tag||'🧩 확인 문제'}</div><div class="q">${step.q}</div>
   <div class="opts ${step.two?'two':''}">${opts}</div>${fb}`;
}

   <div class="q">두 막대가 모두 <span style="color:var(--ok)">초록색</span>이 되는 <b>가장 얇은</b> 두께를 찾아! (검은 선 = 소요강도 554.3 kN)</div>
   <div class="slider">
     <div class="tval" id="tv"></div>
     <input type="range" min="5" max="14" step="0.5" id="tr" value="${st.sliderT}" ${st.solved?'disabled':''}>
     <div class="barrow"><div class="lab"><span>① 소성화 5.5t²</span><b id="v1"></b></div><div class="bar"><i id="b1"></i><span class="nu" id="n1"></span></div></div>
     <div class="barrow"><div class="lab"><span>② 펀칭전단 66t</span><b id="v2"></b></div><div class="bar"><i id="b2"></i><span class="nu" id="n2"></span></div></div>
     <div class="nulab">세로 검은 선 = Nu 554.3 kN</div>
   </div>
   <div id="sfb">${st.solved?sliderOk():''}</div>
   ${st.solved?'':`<button class="btn go" onclick="checkSlider()">이 두께로 결정!</button>`}`;
}
const NU=554.3, MAXB=1000;
function bindSlider(){
  const r=document.getElementById('tr');
  const upd=()=>{
    const t=+r.value; st.sliderT=t;
    const a=5.5*t*t, b=66*t;
    document.getElementById('tv').innerHTML=`t = ${t.toFixed(1)} <small>mm</small>`;
    document.getElementById('v1').textContent=a.toFixed(1)+' kN';
    document.getElementById('v2').textContent=b.toFixed(1)+' kN';
    [['b1',a],['b2',b]].forEach(([id,v])=>{const e=document.getElementById(id);e.style.width=Math.min(100,v/MAXB*100)+'%';e.style.background=v>=NU?'var(--ok)':'var(--no)'});
    ['n1','n2'].forEach(id=>document.getElementById(id).style.left=(NU/MAXB*100)+'%');
  };
  r.addEventListener('input',upd); upd();
}
function sliderOk(){return `<div class="fb ok new"><b>${st.tries===1?'⭐ 한 번에 찾았어!':'찾았다!'}</b><br>10.0 mm에서는 소성화가 550 kN으로 554.3에 살짝 모자라고, <span class="k">10.5 mm</span>에서 둘 다 통과! 정답은 10과 10.5 사이 어딘가야. 다음 화면에서 정확히 계산해 보자.</div><button class="btn go" onclick="nextStep()">다음 ▶</button>`}
function checkSlider(){
  const t=st.sliderT, ok=x=>5.5*x*x>=NU && 66*x>=NU;
  st.tries++;
  const f=document.getElementById('sfb');
  if(ok(t) && !ok(t-0.5)){ st.solved=true; if(st.tries===1) star(); save(); render(); return; }
  let msg;
  if(!ok(t)){ const red=[]; if(5.5*t*t<NU) red.push('① 소성화'); if(66*t<NU) red.push('② 펀칭전단'); msg=`아직 <b>${red.join(', ')}</b> 막대가 빨간색이야! 빨간 건 버티는 힘이 걱정 무게보다 작다는 뜻. 두께를 조금 더 늘려 봐.`; }
  else msg=`안전하긴 해! 그런데 <b>더 얇게</b> 해도 둘 다 초록일 수 있어. 철이 아까우니까 한 칸씩 줄여 봐.`;
  f.innerHTML=`<div class="fb no new"><b>거의 다 왔어 💪</b><br>${msg}</div>`;
}

function renderEnd(){
  const pct=Math.round(st.stars/TOTALQ*100);
  app.innerHTML=`<div class="home">
   <div class="big">🏆</div>
   <h1 style="text-align:center;margin-top:0">LRFD 정복 완료!</h1>
   <div class="big" style="font-size:30px">⭐ ${st.stars} / ${TOTALQ}</div>
   <div class="sub" style="text-align:center">한 번에 맞힌 문제 수 (${pct}%)</div>
   <div class="sum"><h4>🧒 초등학생 버전</h4>무게는 걱정해서 <b>크게</b>, 버티는 힘은 겸손하게 <b>작게</b> 계산하고, 그래도 <b>가장 약한 버티는 힘이 가장 무거운 걱정보다 크면 안전!</b></div>
   <div class="sum"><h4>🎓 대학생 버전</h4>LRFD는 하중계수로 증폭한 하중조합들의 최대 부재력(소요강도)이, 한계상태별 공칭강도에 저항계수 φ를 곱한 값 중 최솟값(설계강도) 이하인지 확인하는 신뢰도 기반 설계법이다. <span class="eq">φRn,min ≥ Ru,max</span></div>
   <div class="sum"><h4>📌 PE 4.2 답</h4>Pu = 480 kN → Nu = 554.3 kN → 소성화 t ≥ 10.04 mm, 펀칭 t ≥ 8.40 mm → <b>소성화 지배, t ≥ 10.04 mm</b> (규격 12 mm 등)</div>
   <button class="btn go" onclick="restart()">처음부터 다시 ↺</button>
   <button class="btn alt" onclick="st.view='home';render()">장면 목록</button>
   <div class="credit">건축공학전공 곽지예 · AI(Claude) 활용 캡스톤 과제</div></div>`;
}

function menuHTML(){
  const list=SCENES.map((s,i)=>`<button class="scn" onclick="goScene(${i})"><span class="n">${i+1}</span><span><b>${s.title}</b><br><small style="color:#7a7f95">${s.sub}</small></span>${st.done[i]?'<span class="done">✔</span>':''}</button>`).join('');
  return `<div class="overlay" onclick="if(event.target===this)closeMenu()"><div class="sheet"><h3>장면 고르기</h3>
   <div class="scenes">${list}</div>
   <button class="btn alt" onclick="st.menu=false;st.view='home';render()">🏠 처음 화면</button></div></div>`;
}

/* ============ 동작 ============ */
function resetStep(){st.line=0;st.tries=0;st.solved=false;qState={picked:[],fb:null};st.sliderT=6}
function goScene(i){st.menu=false;st.view='play';st.sc=i;st.sp=0;resetStep();render()}
function openMenu(){st.menu=true;render()}
function closeMenu(){st.menu=false;render()}
function nextLine(){const s=SCENES[st.sc].steps[st.sp]; if(st.line<s.lines.length-1){st.line++;render()} else nextStep()}
function nextStep(){
  const sc=SCENES[st.sc];
  if(st.sp<sc.steps.length-1){st.sp++;resetStep();render();return}
  st.done[st.sc]=true; save();
  if(st.sc<SCENES.length-1){st.sc++;st.sp=0;resetStep();render()} else {st.view='end';render()}
}
function pick(i){
  const step=SCENES[st.sc].steps[st.sp];
  if(st.solved||qState.picked.includes(i))return;
  st.tries++; qState.picked.push(i);
  if(i===step.a){st.solved=true;qState.fb='ok';if(st.tries===1)star();save()} else qState.fb='no';
  render();
}
function star(){st.got[st.sc+'-'+st.sp]=1;st.stars=Object.keys(st.got).length}
function restart(){st.stars=0;st.got={};st.done={};save();goScene(0)}
render();
</script>
</body>
</html>
